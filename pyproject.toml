[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "custody"
version = "0.1.0"
description = "Chain-of-custody control surface for sensitive refs"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "James Beck" }]
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
secretctl = "custody.cli.secretctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
